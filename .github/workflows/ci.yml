name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t pulsewatch-api ./backend

      - name: Build web image
        run: docker build -t pulsewatch-web ./frontend

  compose-smoke:
    name: Compose smoke test
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with demo data
        run: |
          cp .env.example .env
          sed -i 's/^SEED_DEMO=false/SEED_DEMO=true/' .env

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: PostgreSQL and Redis are both in use
        run: |
          curl -fsS http://localhost:8080/api/health > health.json
          cat health.json
          python3 -c "import json; d = json.load(open('health.json')); assert d['database'] == 'ok', d; assert d['redis'] == 'ok', d"

      - name: nginx serves the React app and proxies only /api
        run: |
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/api-keys
          curl -fsS -o /dev/null http://localhost:8080/status
          curl -fsS -o /dev/null http://localhost:8080/api/status-page

      - name: Log in and read seeded data
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@pulsewatch.local","password":"pulsewatch"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/dashboard > dashboard.json
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/monitors > monitors.json
          python3 -c "import json; m = json.load(open('monitors.json')); assert len(m) >= 1, 'seed data missing'; print('monitors:', len(m))"

      - name: The API log has no tracebacks
        run: |
          docker compose logs api > api.log 2>&1
          if grep -q "Traceback" api.log; then
            cat api.log
            exit 1
          fi

      - name: Show logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose down -v
